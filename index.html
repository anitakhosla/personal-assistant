<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Assistant</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 2rem;
        background: #f5f5f5;
        color: #222;
      }

      h1 {
        margin: 0 0 1.5rem 0;
        font-size: 1.75rem;
      }

      .capture {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.5rem;
      }

      .capture input {
        flex: 1;
        padding: 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
      }

      .capture select {
        padding: 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
      }

      .capture button {
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        background: #222;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      #task-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
      }

      #task-list li {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        background: white;
        padding: 0.75rem 1rem;
        border-radius: 6px;
        border: 1px solid #e5e5e5;
      }

      .task-category {
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
        background: #f0f0f0;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        white-space: nowrap;
      }

      .task-text {
        flex: 1;
        cursor: text;
      }

      .task-edit {
        flex: 1;
        padding: 0.25rem 0.5rem;
        border: 1px solid #ccc;
        border-radius: 4px;
        font: inherit;
        background: white;
        color: #222;
      }

      .delete-btn {
        background: transparent;
        color: #999;
        border: none;
        border-radius: 4px;
        padding: 0 0.5rem;
        cursor: pointer;
        font-size: 1.25rem;
        line-height: 1;
      }

      .delete-btn:hover,
      .delete-btn:focus-visible {
        background: #f0f0f0;
        color: #222;
        outline: none;
      }
    </style>
  </head>

  <body>
    <h1>Personal Assistant</h1>

    <div class="capture">
      <input id="task-input" type="text" placeholder="What's on your mind?" />
      <select id="category-select" aria-label="Category"></select>
      <button id="add-button">Add</button>
    </div>

    <ul id="task-list"></ul>

    <script>
      const CATEGORIES = [
        { slug: "career", label: "Career/Work" },
        { slug: "finances", label: "Finances" },
        { slug: "health", label: "Health" },
        { slug: "hobbies", label: "Hobbies/Interests" },
        { slug: "family", label: "Family" },
        { slug: "growth", label: "Personal Growth" },
        { slug: "home", label: "Home" },
      ];

      const STATUSES = ["active", "awaiting", "done"];
      const DEFAULT_STATUS = "active";
      const DEFAULT_LENS = "you";

      const STORAGE_KEY = "personal-assistant.tasks.v1";
      const STORAGE_VERSION = 2;

      function newId() {
        if (typeof crypto !== "undefined" && crypto.randomUUID) {
          return crypto.randomUUID();
        }
        return `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
      }

      const input = document.querySelector("#task-input");
      const categorySelect = document.querySelector("#category-select");
      const button = document.querySelector("#add-button");
      const taskListEl = document.querySelector("#task-list");

      const tasks = [];

      function load() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          if (!parsed || typeof parsed !== "object") return;
          if (parsed.version !== STORAGE_VERSION) {
            console.warn(`Discarding stored data with version ${parsed.version}`);
            localStorage.removeItem(STORAGE_KEY);
            return;
          }
          if (!Array.isArray(parsed.tasks)) return;
          const validSlugs = new Set(CATEGORIES.map((c) => c.slug));
          const valid = parsed.tasks.filter(
            (t) =>
              t &&
              typeof t.text === "string" &&
              validSlugs.has(t.category),
          );
          tasks.push(...valid);
        } catch (e) {
          console.error("Failed to load tasks from localStorage", e);
        }
      }

      function save() {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({ version: STORAGE_VERSION, tasks }),
        );
      }

      function render() {
        taskListEl.innerHTML = "";
        for (const task of tasks) {
          const item = document.createElement("li");
          item.dataset.id = task.id;

          const chip = document.createElement("span");
          chip.className = "task-category";
          const cat = CATEGORIES.find((c) => c.slug === task.category);
          chip.textContent = cat ? cat.label : task.category;

          const textSpan = document.createElement("span");
          textSpan.className = "task-text";
          textSpan.textContent = task.text;

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "delete-btn";
          deleteBtn.setAttribute("aria-label", "Delete task");
          deleteBtn.textContent = "×";

          item.appendChild(chip);
          item.appendChild(textSpan);
          item.appendChild(deleteBtn);
          taskListEl.appendChild(item);
        }
      }

      function addTask() {
        const text = input.value.trim();
        if (text === "") return;

        tasks.push({
          id: newId(),
          text,
          category: categorySelect.value,
          lens: DEFAULT_LENS,
          goalId: null,
          status: DEFAULT_STATUS,
          deadline: null,
          notes: "",
          createdAt: new Date().toISOString(),
          completedAt: null,
        });

        input.value = "";
        save();
        render();
      }

      function startEdit(li, id, textSpan) {
        const task = tasks.find((t) => t.id === id);
        if (!task) return;

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "task-edit";
        editInput.value = task.text;

        li.replaceChild(editInput, textSpan);
        editInput.focus();
        editInput.select();

        let done = false;

        function restoreSpan() {
          const newSpan = document.createElement("span");
          newSpan.className = "task-text";
          newSpan.textContent = task.text;
          editInput.replaceWith(newSpan);
        }

        function commit() {
          if (done) return;
          done = true;
          const newText = editInput.value.trim();
          // Empty edit reverts to original text (treat as cancel, not delete).
          if (newText && newText !== task.text) {
            task.text = newText;
            save();
          }
          restoreSpan();
        }

        function cancel() {
          if (done) return;
          done = true;
          restoreSpan();
        }

        editInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") {
            e.preventDefault();
            commit();
          } else if (e.key === "Escape") {
            e.preventDefault();
            cancel();
          }
        });

        editInput.addEventListener("blur", commit);
      }

      taskListEl.addEventListener("click", (e) => {
        const li = e.target.closest("li[data-id]");
        if (!li) return;
        const id = li.dataset.id;

        if (e.target.classList.contains("delete-btn")) {
          const task = tasks.find((t) => t.id === id);
          if (!task) return;
          const preview =
            task.text.length > 80 ? task.text.slice(0, 77) + "..." : task.text;
          if (!confirm(`Delete: "${preview}"?`)) return;
          const idx = tasks.findIndex((t) => t.id === id);
          if (idx !== -1) {
            tasks.splice(idx, 1);
            save();
            render();
          }
          return;
        }

        if (e.target.classList.contains("task-text")) {
          startEdit(li, id, e.target);
        }
      });

      button.addEventListener("click", addTask);

      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          addTask();
        }
      });

      function populateCategorySelect() {
        for (const cat of CATEGORIES) {
          const option = document.createElement("option");
          option.value = cat.slug;
          option.textContent = cat.label;
          categorySelect.appendChild(option);
        }
      }

      populateCategorySelect();
      load();
      render();
    </script>
  </body>
</html>
